<!DOCTYPE html>
<html>
<head>
  <title>Stock Market Dashboard</title>
  <script src="https://s3.tradingview.com/tv.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top left, #111827, #000000 60%);
      color: white;
      text-align: center;
    }

    .logo {
      width: 140px;
      margin-top: 25px;
      opacity: 0.9;
    }

    h1 {
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .chart-container {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
      border-radius: 20px;
      background: rgba(20, 20, 20, 0.8);
      box-shadow: 0 0 40px rgba(0, 255, 136, 0.15);
      backdrop-filter: blur(10px);
    }

    .container {
      margin-top: 30px;
    }

    .box {
      background: rgba(30,30,30,0.8);
      padding: 20px;
      margin: 15px;
      border-radius: 15px;
      display: inline-block;
      width: 200px;
      transition: 0.3s ease;
    }

    .box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(0,255,136,0.3);
    }

    .green { color: #00ff88; }
    .red { color: #ff4d4d; }

  </style>
</head>

<body>

  <img src="logo.png" class="logo" />
  <h1>Live Stock Market Dashboard</h1>

  <div class="chart-container">
    <div id="tradingview_chart"></div>
  </div>

  <script>
    new TradingView.widget({
      "width": "100%",
      "height": 500,
      "symbol": "NASDAQ:AAPL",
      "interval": "1",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "toolbar_bg": "#000000",
      "hide_top_toolbar": false,
      "enable_publishing": false,
      "container_id": "tradingview_chart"
    });
  </script>

  <div class="container">
    <div class="box green">
      <h2>Top Gainer</h2>
      <p>NVDA +2.34%</p>
    </div>

    <div class="box red">
      <h2>Top Loser</h2>
      <p>TSLA -1.45%</p>
    </div>

    <div class="box green">
      <h2>Biggest Rise</h2>
      <p>AMD +3.12%</p>
    </div>
  </div>

</body>
</html>
