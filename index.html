<!DOCTYPE html>
<html>
<head>
  <title>Stock Market Dashboard</title>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #000000, #0f0f0f, #111827);
      color: white;
      text-align: center;
    }

    .logo {
      width: 150px;
      margin-top: 20px;
    }

    .container {
      padding: 20px;
    }

    .box {
      background: #111;
      padding: 20px;
      margin: 15px;
      border-radius: 10px;
      display: inline-block;
      width: 200px;
    }

    .green { color: #00ff88; }
    .red { color: #ff4d4d; }
  </style>
</head>

<body>

  <img src="logo.png" class="logo" />

  <h1>Live Stock Market Dashboard</h1>

  <div id="tradingview_chart"></div>

  <script>
    new TradingView.widget({
      "width": "100%",
      "height": 500,
      "symbol": "NASDAQ:AAPL",
      "interval": "1",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "en",
      "container_id": "tradingview_chart"
    });
  </script>

  <div class="container">
    <div class="box green">
      <h2>Top Gainer</h2>
      <p>NVDA +2.34%</p>
    </div>

    <div class="box red">
      <h2>Top Loser</h2>
      <p>TSLA -1.45%</p>
    </div>

    <div class="box green">
      <h2>Biggest Rise</h2>
      <p>AMD +3.12%</p>
    </div>
  </div>

</body>
</html>
